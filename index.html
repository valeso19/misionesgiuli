<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misiones de Giuliana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }
/* Concepto: un gran salón a la luz de las velas. Velas flotando al fondo, un sobre con sello de cera,
   pergaminos que se abren con cada misión y un color de casa que tiñe todo al elegirla. */
:root {
  --bg: #0d0912;
  --ink: #f5ead2;
  --muted: #b3a58d;
  --line: #43344a;
  --gold: #f2b94b;
  --gold-hi: #ffe3a1;
  --gold-lo: #b5791a;
  --hue: #f2b94b;
  --trim: #ffe3a1;
  --deep: #2b1c0d;
  --on: #140d05;
  --parch-ink: #2b1d0e;
  --bad: #ff9a90;
  --display: 'Cinzel Decorative', 'Trajan Pro', Georgia, serif;
  --body: 'EB Garamond', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}
.g { --hue: #ef5f58; --trim: #f0c24e; --deep: #3d1017; }
.s { --hue: #43bf7c; --trim: #cfd8de; --deep: #0b2b1c; }
.r { --hue: #6a9af0; --trim: #d2a26a; --deep: #101f44; }
.h { --hue: #f4c733; --trim: #f7e9ad; --deep: #2c2407; }

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(100% 55% at 50% 108%, #46230f 0%, rgba(13, 9, 18, 0) 72%);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.45;
  min-height: 100vh;
  padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
#candles, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#candles { z-index: 0; }
#fx { z-index: 40; }
#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; min-height: 56px; }
.brand { font-family: var(--display); font-weight: 700; font-size: .9rem; color: var(--gold); letter-spacing: .06em; }
button, input { font-family: var(--body); font-size: 1rem; }
button { cursor: pointer; color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
.ghost { min-height: 44px; padding: 0 14px; background: transparent; border: 1px solid var(--line); border-radius: 4px; font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ghost:hover { border-color: var(--hue); color: var(--ink); }
.ghost.warn { border-color: #d0605a; color: var(--bad); }
.cta { display: block; width: 100%; min-height: 56px; padding: 0 22px; border: 0; border-radius: 4px; background: linear-gradient(180deg, var(--trim), var(--hue) 55%, var(--hue)); color: var(--on); font-family: var(--display); font-weight: 900; font-size: 1.05rem; letter-spacing: .05em; box-shadow: 0 0 34px -6px var(--hue); transition: transform .12s, filter .2s; }
.cta:hover { filter: brightness(1.08); }
.cta:active { transform: scale(.98); }
.cta:disabled { filter: grayscale(.8) brightness(.6); box-shadow: none; cursor: not-allowed; }

.kicker { margin: 0; font-size: .8rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--hue); }
.title { font-family: var(--display); font-weight: 900; line-height: 1.1; margin: 0; text-wrap: balance;
  color: var(--gold); background: linear-gradient(100deg, #b5791a 10%, #ffe3a1 35%, #f2b94b 55%, #b5791a 90%); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 5s linear infinite; }
@keyframes shimmer { to { background-position: -220% 0; } }
.scene { animation: sceneIn .7s ease-out both; }
@keyframes sceneIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* Bienvenida */
.welcome { display: grid; gap: 18px; justify-items: center; text-align: center; padding-top: 10px; }
.welcome .title { font-size: clamp(2rem, 8.6vw, 3.1rem); }
.seal { position: relative; width: 132px; height: 132px; display: grid; place-items: center; margin-bottom: 4px;
  border-radius: 47% 53% 49% 51% / 52% 46% 54% 48%;
  background: radial-gradient(circle at 36% 30%, #e0524a 0%, #a3231f 52%, #5e0f10 100%);
  box-shadow: 0 0 0 5px rgba(120, 20, 20, .55), 0 12px 34px rgba(0, 0, 0, .6), 0 0 60px rgba(242, 185, 75, .28);
  animation: floaty 4s ease-in-out infinite alternate; }
.seal::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 2px solid rgba(255, 227, 161, .55); }
.seal span { font-family: var(--display); font-weight: 900; font-size: 2.6rem; color: var(--gold-hi); text-shadow: 0 -1px 0 rgba(255, 255, 255, .4), 0 2px 3px rgba(60, 5, 5, .9); }
@keyframes floaty { from { transform: translateY(-5px) rotate(-3deg); } to { transform: translateY(6px) rotate(3deg); } }
.tag { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: .06em; color: var(--ink); position: relative; padding-bottom: 8px; }
.tag::after { content: ""; position: absolute; left: 50%; bottom: 0; height: 2px; width: 100%; max-width: 220px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: grow 1.6s .4s ease-out both; }
@keyframes grow { from { width: 0; } to { width: 100%; } }
.lead { margin: 0; font-size: 1.22rem; text-wrap: pretty; max-width: 34ch; }

/* Casa */
.setup { display: grid; gap: 16px; }
.setup h1 { font-family: var(--display); font-weight: 700; font-size: 1.7rem; margin: 4px 0 0; color: var(--gold-hi); text-wrap: balance; }
.field { display: grid; gap: 6px; }
.field label { font-size: .8rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.field input { width: 100%; min-height: 52px; padding: 0 14px; background: rgba(0, 0, 0, .4); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); font-size: 1.1rem; }
.field input:focus { border-color: var(--gold); }
.houses { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hc { position: relative; display: grid; justify-items: center; gap: 8px; padding: 16px 8px 14px; background: linear-gradient(165deg, var(--deep), #130e1a 80%); border: 1px solid var(--line); border-radius: 4px; transition: border-color .2s, transform .15s, box-shadow .2s; min-width: 0; }
.hc:hover { border-color: var(--hue); }
.hc[aria-checked="true"] { border-color: var(--hue); box-shadow: 0 0 0 1px var(--hue), 0 0 30px -4px var(--hue); transform: translateY(-2px); }
.hc .nm { font-family: var(--display); font-weight: 700; font-size: 1rem; color: var(--hue); letter-spacing: .03em; overflow-wrap: anywhere; }
.crest { width: 44px; height: 52px; flex: none; }
.crest path { fill: var(--hue); stroke: var(--trim); stroke-width: 2.5; }
.crest text { font-family: var(--display); font-weight: 900; font-size: 30px; fill: var(--on); }

/* Juego */
.chip { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border: 1px solid var(--hue); border-radius: 4px; background: linear-gradient(165deg, var(--deep), #130e1a 85%); margin-bottom: 14px; }
.chip .crest { width: 28px; height: 34px; }
.chip .who { min-width: 0; display: grid; }
.chip .hn { font-family: var(--display); font-weight: 700; font-size: 1rem; color: var(--hue); overflow-wrap: anywhere; }
.chip .pn { font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
.chip .sc { margin-left: auto; text-align: right; }
.chip output { display: block; font-family: var(--display); font-weight: 900; font-size: 1.9rem; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; text-shadow: 0 0 22px var(--hue); }
.chip output.bump { animation: bump .5s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); } }
.chip small { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--trim); }

.progress { display: grid; gap: 6px; margin-bottom: 18px; }
.progress p { margin: 0; font-size: .95rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.bar2 { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar2 i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--hue), var(--trim)); transition: width .9s cubic-bezier(.3, .8, .3, 1); }

.draw { display: grid; gap: 16px; text-align: center; justify-items: center; padding-block: 10px; }
.draw .lead { font-size: 1.15rem; color: var(--muted); }
.scrollicon { width: 150px; height: 96px; position: relative; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .6)); }
.scrollicon::before, .scrollicon::after { content: ""; position: absolute; left: 0; right: 0; height: 18px; border-radius: 9px; background: linear-gradient(180deg, #8a6a33, #d8bd7c 45%, #6d4f21); }
.scrollicon::before { top: 0; } .scrollicon::after { bottom: 0; }
.scrollicon i { position: absolute; left: 10px; right: 10px; top: 10px; bottom: 10px; background: linear-gradient(180deg, #efe3c0, #dcc994); }
.wax { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%; background: radial-gradient(circle at 36% 30%, #e0524a, #8f1d1b 70%); box-shadow: 0 2px 8px rgba(0, 0, 0, .6); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: .95rem; color: var(--gold-hi); }
.opening .scrollicon { animation: rattle .18s linear infinite; }
@keyframes rattle { 25% { transform: rotate(-3deg) translateX(-2px); } 75% { transform: rotate(3deg) translateX(2px); } }
.opening .wax { animation: glow 1.2s ease-in forwards; }
@keyframes glow { to { box-shadow: 0 0 30px 10px rgba(255, 227, 161, .9); transform: scale(1.25); } }

.scroll { position: relative; margin: 0 0 16px; filter: drop-shadow(0 18px 28px rgba(0, 0, 0, .55)); }
.scroll::before, .scroll::after { content: ""; display: block; height: 18px; border-radius: 9px; background: linear-gradient(180deg, #8a6a33, #d8bd7c 45%, #6d4f21); position: relative; z-index: 2; }
.paper { position: relative; margin: -6px 10px; padding: 24px 22px 22px; color: var(--parch-ink); background: linear-gradient(180deg, #efe3c0, #e2d1a2); box-shadow: inset 0 0 44px rgba(120, 80, 20, .35); animation: unroll 1.1s cubic-bezier(.3, .8, .3, 1) both; }
@keyframes unroll { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.paper .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.paper .kicker { color: #7a5413; }
.coin { flex: none; padding: 3px 12px; border-radius: 3px; background: #3b2508; color: #ffe3a1; font-family: var(--display); font-weight: 700; font-size: .9rem; }
.paper h2 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; margin: 8px 0 12px; color: #3b2508; text-wrap: balance; }
.paper p { margin: 0 0 10px; font-size: 1.2rem; line-height: 1.45; opacity: 0; animation: lineIn .8s ease-out forwards; }
.paper .mtext { animation-delay: .8s; font-style: italic; }
.paper .proof { animation-delay: 1.3s; padding-top: 10px; border-top: 1px dashed rgba(60, 40, 10, .45); margin-bottom: 0; font-size: 1.1rem; }
@keyframes lineIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.badge { display: inline-block; margin-right: 6px; padding: 2px 9px; border-radius: 3px; background: #3b2508; color: #f1e4be; font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; vertical-align: 2px; }

.valeria { margin: 0 0 14px; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--hue); border-radius: 3px; background: rgba(0, 0, 0, .25); font-size: 1.05rem; }
.valeria p { margin: 0; }
.valeria strong { color: var(--trim); }
.gate { display: grid; gap: 10px; }
.gate label { font-size: .8rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--hue); }
.gate input { width: 100%; min-height: 60px; padding: 0 14px; background: rgba(0, 0, 0, .4); border: 1px solid var(--hue); border-radius: 4px; color: var(--trim); font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: .12em; text-align: center; text-transform: uppercase; }
.gate input::placeholder { color: #6f6277; letter-spacing: .06em; font-size: 1rem; font-family: var(--body); font-weight: 400; text-transform: none; }
.gate input:focus { box-shadow: 0 0 0 3px rgba(255, 255, 255, .12), 0 0 28px -4px var(--hue); }
.gate input.shake { animation: shake .45s; border-color: var(--bad); }
@keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.msg { min-height: 1.5em; margin: 0; text-align: center; font-size: 1.05rem; }
.msg.bad { color: var(--bad); }

.win { display: grid; gap: 12px; text-align: center; justify-items: center; padding: 20px 0 6px; }
.plus { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(4rem, 20vw, 6rem); line-height: 1; color: var(--trim); text-shadow: 0 0 40px var(--hue); animation: plusIn 1.1s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes plusIn { 0% { opacity: 0; transform: translateY(40px) scale(.4); } 100% { opacity: 1; transform: none; } }
.win .wmsg { margin: 0; font-size: 1.25rem; animation: lineIn .8s .5s ease-out both; }
.win .cta { animation: lineIn .8s 1s ease-out both; }
.done { margin-top: 22px; }
.done summary { cursor: pointer; color: var(--muted); font-size: 1rem; padding: 10px 0; }
.done ul { margin: 0; padding: 0 0 0 20px; color: var(--ink); }
.done li { margin-bottom: 4px; }
.done li span { color: var(--trim); font-variant-numeric: tabular-nums; }

.end { display: grid; gap: 14px; text-align: center; justify-items: center; padding-top: 10px; }
.end .title { font-size: clamp(1.9rem, 8vw, 2.7rem); }
.end .big { margin: 0; font-family: var(--display); font-weight: 900; font-size: 4.4rem; line-height: 1; color: var(--trim); text-shadow: 0 0 40px var(--hue); }
footer { margin-top: 30px; display: flex; justify-content: center; }
.secret { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px; padding: 12px 14px; border: 1px dashed var(--hue); border-radius: 3px; background: rgba(0, 0, 0, .3); font-size: 1.02rem; }
.secret b { color: var(--trim); letter-spacing: .12em; text-transform: uppercase; font-size: .8rem; display: block; margin-bottom: 2px; }
.secret .eye { flex: none; width: 26px; height: 26px; color: var(--hue); animation: blink 4s ease-in-out infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.caught { margin-top: 4px; }
.caught-msg { margin: 0; text-align: center; color: var(--bad); min-height: 1.4em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

</head>
<body>
<canvas id="candles" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="app">
  <header class="bar">
    <span class="brand">Misiones de Giuliana</span>
    <button class="ghost" id="snd" type="button" aria-pressed="true">Sonido</button>
  </header>
  <main id="stage"></main>
  <footer><button class="ghost" id="restart" type="button">Empezar de nuevo</button></footer>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'misiones-giuliana-v2';
  var HAND = 10; /* cuántas misiones le tocan a cada persona */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (s, r) { return (r || document).querySelector(s); };

  var HOUSES = [
    { id: 'g', name: 'Gryffindor' }, { id: 's', name: 'Slytherin' },
    { id: 'r', name: 'Ravenclaw' }, { id: 'h', name: 'Hufflepuff' }
  ];
  var COLORS = { g: ['#ef5f58', '#f0c24e'], s: ['#43bf7c', '#cfd8de'], r: ['#6a9af0', '#d2a26a'], h: ['#f4c733', '#f7e9ad'] };

  /* Los códigos se guardan como huella, no como texto. */
  var MISSIONS = [
    { id: 1, pts: 15, title: "La palabra prohibida", h: "7d28e321623df114",
      texts: ["Lográ que 5 personas distintas digan la palabra «perro» en voz alta. Podés hacer preguntas, contar una anécdota o lo que se te ocurra.", "Lográ que 5 personas distintas digan la palabra «gato» en voz alta. Podés hacer preguntas, contar una anécdota o lo que se te ocurra.", "Lográ que 5 personas distintas digan la palabra «pizza» en voz alta. Podés hacer preguntas, contar una anécdota o lo que se te ocurra.", "Lográ que 5 personas distintas digan la palabra «dragón» en voz alta. Podés hacer preguntas, contar una anécdota o lo que se te ocurra.", "Lográ que 5 personas distintas digan la palabra «torta» en voz alta. Podés hacer preguntas, contar una anécdota o lo que se te ocurra.", "Lográ que 5 personas distintas digan la palabra «escoba» en voz alta. Podés hacer preguntas, contar una anécdota o lo que se te ocurra."],
      proof: "Traé a 2 de esas personas para que Valeria les confirme." },
    { id: 2, pts: 10, title: "El censo de casas", h: "9a33848049b6d3ed",
      texts: ["Preguntale a 4 personas a qué casa de Hogwarts les gustaría pertenecer y por qué.", "Preguntale a 4 personas qué poder mágico elegirían tener y por qué."],
      proof: "Contale a Valeria qué respondió cada una." },
    { id: 3, pts: 15, title: "Foto de hechizo", h: "efca2880fba62787",
      texts: ["Sacate una selfie con 4 personas, todos haciendo la pose de lanzar un hechizo con una varita imaginaria.", "Sacate una selfie con 4 personas, todos con cara de susto como si vieran un dragón."],
      proof: "Mostrale la foto a Valeria." },
    { id: 4, pts: 20, title: "El mago veterano", h: "333da951b49b839e",
      texts: ["Convencé a alguien mayor de 40 de que se saque una foto con vos en pose de mago o de bruja."],
      proof: "Mostrale la foto a Valeria." },
    { id: 5, pts: 15, title: "Nombre mágico", h: "6483b0197f3060f4",
      texts: ["Inventá un hechizo con un nombre nuevo y lográ que 3 personas lo griten a la vez.", "Inventá el nombre de una poción y lográ que 3 personas lo digan a la vez con cara de misterio."],
      proof: "Valeria tiene que escucharlo en vivo." },
    { id: 6, pts: 20, title: "Arcoíris de casas", h: "dbaad96b8337b028",
      texts: ["Encontrá a 4 personas que lleven puesto algo rojo, verde, azul y amarillo, una de cada color.", "Encontrá a 4 personas que lleven puesto algo negro, blanco, celeste y rosa, una de cada color."],
      proof: "Traé a las 4 personas hasta Valeria." },
    { id: 7, pts: 15, title: "Luz y sombra", h: "20660aeab155e133",
      texts: ["Decí «Lumos» y lográ que 5 personas aplaudan todas al mismo tiempo.", "Decí «Nox» y lográ que 5 personas se queden quietas y en silencio durante 5 segundos."],
      proof: "Valeria tiene que verlo en vivo o recibir un video corto." },
    { id: 8, pts: 10, title: "Palabras para la cumpleañera", h: "fe0b3637e1033bb8",
      texts: ["Conseguí que 3 personas te digan una palabra linda para Giuliana.", "Conseguí que 3 personas le pidan un deseo a Giuliana y anotalos."],
      proof: "Contale a Valeria lo que dijo cada una." },
    { id: 9, pts: 10, title: "El juego del ingenio", h: "f4d4682f85aba290",
      texts: ["Contá un chiste y hacé reír a 3 personas.", "Decí una adivinanza y lográ que 3 personas la resuelvan."],
      proof: "Valeria o una persona testigo lo confirma." },
    { id: 10, pts: 20, title: "La fila de magos", h: "4961a2f99bb90f92",
      texts: ["Armá una fila de 6 personas ordenadas de la más alta a la más baja."],
      proof: "Valeria revisa la fila." },
    { id: 11, pts: 15, title: "El grito mágico", h: "e733cd9e76436155",
      texts: ["Lográ que 5 personas estiren la mano y griten «Accio» a la vez.", "Lográ que 5 personas hagan como que abren una puerta y griten «Alohomora» a la vez."],
      proof: "Valeria tiene que ver o escuchar el grito." },
    { id: 12, pts: 20, title: "Baile del banquete", h: "39fe5d84094b7f85",
      texts: ["Conseguí que 3 personas bailen con vos durante 10 segundos."],
      proof: "Un video corto, o Valeria presente." },
    { id: 13, pts: 20, title: "Estatuas de piedra", h: "5384ebf92b701fcc",
      texts: ["Armá con 4 personas una estatua que se quede quieta durante 10 segundos."],
      proof: "Valeria mira la estatua y cuenta hasta 10." },
    { id: 14, pts: 10, title: "El bestiario", h: "7f81641e55ae3d4b",
      texts: ["Preguntale a 5 personas cuál es su animal favorito y anotalo en tu celular.", "Preguntale a 5 personas cuál es su comida favorita y anotalo en tu celular."],
      proof: "Mostrale la lista a Valeria." },
    { id: 15, pts: 15, title: "Trabalenguas mágico", h: "fdc18c45969347d6",
